; Bench receiver for the DGAC beacon frame.
; Standalone project, built apart from the beacon firmware:
;   pio run -d tools/recepteur -t upload --upload-port <port>
; then read its serial output at 115200 baud.

[env:recepteur]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
